<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ball Roller</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0b0d17; font-family: system-ui, sans-serif; touch-action: none; -webkit-user-select: none; }
  #touch { position: fixed; inset: 0; z-index: 16; pointer-events: none; display: none; }
  #touch.on { display: block; }
  #joy {
    position: absolute; left: 22px; bottom: 26px; width: 120px; height: 120px; border-radius: 50%;
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.18); pointer-events: auto;
  }
  #knob {
    position: absolute; left: 33px; top: 33px; width: 54px; height: 54px; border-radius: 50%;
    background: rgba(108,240,194,.38); border: 1px solid rgba(108,240,194,.7);
  }
  #jump {
    position: absolute; right: 26px; bottom: 40px; width: 90px; height: 90px; border-radius: 50%;
    background: rgba(108,240,194,.16); border: 2px solid rgba(108,240,194,.6);
    color: #dfffe9; font-weight: 700; font-size: 15px; letter-spacing: 1px;
    display: flex; align-items: center; justify-content: center; pointer-events: auto;
  }
  #jump:active { background: rgba(108,240,194,.32); }
  #lbbtn {
    position: fixed; left: 16px; top: 72px; z-index: 12;
    background: rgba(40,48,90,.7); color: #e6ecff; border: 1px solid rgba(150,170,240,.4);
    border-radius: 7px; padding: 5px 10px; font-size: 12px; font-family: inherit; cursor: pointer;
  }
  #lbbtn:hover { background: rgba(78,92,164,.9); }
  #lbpanel {
    position: fixed; inset: 0; z-index: 25; display: none;
    align-items: center; justify-content: center; flex-direction: column;
    background: rgba(11,13,23,.82); backdrop-filter: blur(3px); color: #e8ecff; user-select: none;
  }
  #lbpanel.on { display: flex; }
  #lbpanel h2 { font-size: 22px; margin-bottom: 14px; color: #6cf0c2; letter-spacing: 1px; }
  #lb-list { min-width: 300px; font-size: 15px; }
  #lb-list .row { display: flex; justify-content: space-between; gap: 24px; padding: 5px 12px; border-radius: 6px; }
  #lb-list .row.me { background: rgba(108,240,194,.16); color: #fff; }
  #lb-list .row .rk { color: #8ea0d8; width: 26px; }
  #lb-list .row .tm { color: #6cf0c2; font-variant-numeric: tabular-nums; }
  #lbpanel .hint { margin-top: 16px; font-size: 12px; opacity: .7; }
  #hud {
    position: fixed; top: 16px; left: 16px; z-index: 10;
    color: #e8ecff; font-size: 14px; line-height: 1.6; user-select: none;
    text-shadow: 0 1px 3px rgba(0,0,0,.6);
  }
  #hud b { color: #6cf0c2; }
  #banner {
    position: fixed; inset: 0; z-index: 20; display: none;
    align-items: center; justify-content: center; flex-direction: column;
    color: #fff; background: rgba(11,13,23,.72); backdrop-filter: blur(2px);
    text-align: center; user-select: none;
  }
  #banner h1 { font-size: 42px; margin-bottom: 8px; letter-spacing: 1px; }
  #banner p { font-size: 15px; opacity: .85; }
  #banner .key { color: #6cf0c2; font-weight: 700; }
  #banner .best { color: #ffd76a; font-weight: 700; }
  #levelpick {
    background: rgba(40,48,90,.85); color: #6cf0c2; font-weight: 700;
    border: 1px solid rgba(150,170,240,.4); border-radius: 6px;
    padding: 1px 4px; font-size: 13px; cursor: pointer; font-family: inherit;
  }
  #levelpick:focus { outline: 1px solid #6cf0c2; }
  #levelpick option { background: #14182c; color: #e6ecff; }
  #scores {
    position: fixed; top: 16px; right: 16px; z-index: 10;
    color: #cdd6ff; font-size: 13px; user-select: none;
    background: rgba(20,24,44,.55); border: 1px solid rgba(120,140,220,.25);
    border-radius: 10px; padding: 10px 12px; min-width: 132px;
    text-shadow: 0 1px 2px rgba(0,0,0,.5); backdrop-filter: blur(3px);
  }
  #scores h2 { font-size: 12px; letter-spacing: 1px; text-transform: uppercase;
    color: #8ea0d8; margin-bottom: 6px; font-weight: 700; }
  .srow { display: flex; justify-content: space-between; gap: 14px; padding: 2px 0; }
  .srow span:last-child { color: #6cf0c2; font-variant-numeric: tabular-nums; }
  .srow.cur { color: #fff; }
  .srow.cur span:last-child { color: #ffd76a; }
  .srow.empty span:last-child { color: #556; }
  #scores .total { margin-top: 6px; padding-top: 6px; border-top: 1px solid rgba(120,140,220,.2); }
</style>
</head>
<body>
<div id="hud">
  <div>Level <select id="levelpick"></select> &nbsp; Time <b id="time">0.0</b>s</div>
  <div>Move <b>WASD / Arrows</b> &nbsp; Jump <b>SPACE</b> &nbsp; Restart <b>R</b> &nbsp; Level <b>[ ]</b> &nbsp; Mute <b>M</b></div>
</div>
<div id="scores">
  <h2>Best Times</h2>
  <div id="scores-body"></div>
</div>
<div id="touch">
  <div id="joy"><div id="knob"></div></div>

</div>
<button id="lbbtn">🏆 Leaderboard</button>
<div id="lbpanel">
  <h2 id="lb-title">Leaderboard</h2>
  <div id="lb-list">Loading…</div>
  <p class="hint">Tap anywhere / press <span class="key" style="color:#6cf0c2">L</span> to close</p>
</div>
<div id="banner">
  <h1 id="banner-title">Ball Roller</h1>
  <p id="banner-sub">Press <span class="key">SPACE</span> to start</p>
</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }

<script type="module">
import * as THREE from 'three';

// ---------- Scene ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0d17);
scene.fog = new THREE.Fog(0x0b0d17, 120, 520);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 1200);

// ---------- Starfield (far distance, fog-immune) ----------
const STAR_COUNT = 3200;
const PR = Math.min(devicePixelRatio, 2);
const _sc = new THREE.Color();
const starGeo = new THREE.BufferGeometry();
const sPos = new Float32Array(STAR_COUNT * 3);
const sCol = new Float32Array(STAR_COUNT * 3);
const sSize = new Float32Array(STAR_COUNT);
const sPhase = new Float32Array(STAR_COUNT);
for (let i = 0; i < STAR_COUNT; i++) {
  const u = Math.random() * 2 - 1, th = Math.random() * Math.PI * 2;
  const r = Math.sqrt(1 - u * u), R = 300 + Math.random() * 500;
  sPos[i * 3]     = Math.cos(th) * r * R;
  sPos[i * 3 + 1] = u * R;                            // full sphere
  sPos[i * 3 + 2] = Math.sin(th) * r * R;
  const t = Math.random();
  if (t > 0.92) _sc.setHSL(0.60, 0.55, 0.82);         // cool blue
  else if (t > 0.84) _sc.setHSL(0.08, 0.6, 0.82);     // warm amber
  else _sc.setHSL(0, 0, 0.72 + Math.random() * 0.28); // white, varied
  sCol[i * 3] = _sc.r; sCol[i * 3 + 1] = _sc.g; sCol[i * 3 + 2] = _sc.b;
  // skew toward small stars, a rare few large
  sSize[i] = (1.0 + Math.pow(Math.random(), 3.0) * 6.0) * PR;
  sPhase[i] = Math.random() * Math.PI * 2;
}
starGeo.setAttribute('position', new THREE.BufferAttribute(sPos, 3));
starGeo.setAttribute('aColor', new THREE.BufferAttribute(sCol, 3));
starGeo.setAttribute('aSize', new THREE.BufferAttribute(sSize, 1));
starGeo.setAttribute('aPhase', new THREE.BufferAttribute(sPhase, 1));
const starMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 } },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: /* glsl */`
    attribute vec3 aColor;
    attribute float aSize;
    attribute float aPhase;
    uniform float uTime;
    varying vec3 vColor;
    void main() {
      vColor = aColor;
      float tw = 0.7 + 0.3 * sin(uTime * 2.2 + aPhase);   // per-star twinkle
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = aSize * tw;                          // constant screen size (no attenuation)
    }`,
  fragmentShader: /* glsl */`
    varying vec3 vColor;
    void main() {
      float r = length(gl_PointCoord - vec2(0.5));
      if (r > 0.5) discard;
      float a = smoothstep(0.5, 0.0, r);                 // soft round glow
      gl_FragColor = vec4(vColor, a);
    }`,
});
const stars = new THREE.Points(starGeo, starMat);
scene.add(stars);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// ---------- Procedural audio (Web Audio, no files) ----------
const Sound = (() => {
  let ctx, master, rollGain, rollFilter, muted = false;
  function ensure() {
    if (ctx) return;
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain(); master.gain.value = 0.55; master.connect(ctx.destination);
    // rolling rumble: looping white noise -> lowpass -> gain (driven by speed)
    const n = ctx.sampleRate * 2, buf = ctx.createBuffer(1, n, ctx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    const src = ctx.createBufferSource(); src.buffer = buf; src.loop = true;
    rollFilter = ctx.createBiquadFilter(); rollFilter.type = 'lowpass'; rollFilter.frequency.value = 300;
    rollGain = ctx.createGain(); rollGain.gain.value = 0;
    src.connect(rollFilter); rollFilter.connect(rollGain); rollGain.connect(master); src.start();
    // ambient space drone: two soft detuned sines
    [55, 82.41].forEach(f => {
      const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f;
      const g = ctx.createGain(); g.gain.value = 0.045; o.connect(g); g.connect(master); o.start();
    });
  }
  function blip(freq, dur, type, vol, slideTo) {
    if (!ctx || muted) return;
    const t = ctx.currentTime;
    const o = ctx.createOscillator(); o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    const g = ctx.createGain(); g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
  }
  return {
    resume() { ensure(); if (ctx.state === 'suspended') ctx.resume(); },
    jump() { blip(300, 0.18, 'square', 0.22, 640); },
    land() { blip(150, 0.13, 'sine', 0.3, 70); },
    win() { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => blip(f, 0.22, 'triangle', 0.28), i * 110)); },
    fall() { blip(420, 1.3, 'sawtooth', 0.22, 55); },
    roll(speed, grounded) {
      if (!rollGain) return;
      const target = (grounded && !muted) ? Math.min(0.22, speed * 0.014) : 0;
      rollGain.gain.setTargetAtTime(target, ctx.currentTime, 0.08);
      rollFilter.frequency.setTargetAtTime(250 + speed * 45, ctx.currentTime, 0.1);
    },
    toggleMute() { muted = !muted; if (master) master.gain.setTargetAtTime(muted ? 0 : 0.55, ctx.currentTime, 0.05); return muted; },
  };
})();

// ---------- Global leaderboard (Supabase REST, per-level best times) ----------
const LB_URL = 'https://qeimeyocuusfukyaqqsp.supabase.co/rest/v1/ballroller_scores';
const LB_KEY = 'sb_publishable_Hc_WIXxTV9YqJ__CNRhBBA_2NVjIylQ';
const LB_HDR = { apikey: LB_KEY, Authorization: 'Bearer ' + LB_KEY, 'Content-Type': 'application/json' };
let playerName = localStorage.getItem('ballRoller.name') || '';
function ensureName() {
  if (!playerName) {
    const n = (prompt('Enter a name for the leaderboard:', '') || '').trim().slice(0, 24);
    if (n) { playerName = n; localStorage.setItem('ballRoller.name', n); }
  }
  return playerName;
}
async function submitScore(levelIdx, ms) {
  const name = ensureName(); if (!name) return;
  try {
    await fetch(LB_URL, { method: 'POST', headers: { ...LB_HDR, Prefer: 'return=minimal' },
      body: JSON.stringify({ name, level: levelIdx + 1, time_ms: ms }) });
  } catch (e) {}
}
async function fetchTop(levelIdx) {
  try {
    const r = await fetch(`${LB_URL}?select=name,time_ms&level=eq.${levelIdx + 1}&order=time_ms.asc&limit=10`, { headers: LB_HDR });
    return r.ok ? await r.json() : [];
  } catch (e) { return []; }
}
function escHtml(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
const lbPanel = document.getElementById('lbpanel');
const lbList = document.getElementById('lb-list');
const lbTitleEl = document.getElementById('lb-title');
async function openLeaderboard(levelIdx) {
  lbTitleEl.textContent = `Leaderboard — Level ${levelIdx + 1}`;
  lbList.innerHTML = 'Loading…';
  lbPanel.classList.add('on');
  const rows = await fetchTop(levelIdx);
  lbList.innerHTML = rows.length
    ? rows.map((r, i) => `<div class="row${r.name === playerName ? ' me' : ''}"><span class="rk">${i + 1}</span><span>${escHtml(r.name)}</span><span class="tm">${(r.time_ms / 1000).toFixed(1)}s</span></div>`).join('')
    : '<div class="row">No times yet — be the first!</div>';
}
function closeLeaderboard() { lbPanel.classList.remove('on'); }
lbPanel.addEventListener('click', closeLeaderboard);
document.getElementById('lbbtn').addEventListener('click', () => openLeaderboard(level));

// ---------- Touch controls (mobile): virtual joystick + jump button ----------
const touchMove = { x: 0, z: 0, active: false };
{
  const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  if (isTouch) document.getElementById('touch').classList.add('on');
  const joy = document.getElementById('joy'), knob = document.getElementById('knob');
  let joyId = null, cx = 0, cy = 0; const MAX = 45;
  function move(e) {
    for (const t of e.changedTouches) {
      if (t.identifier !== joyId) continue;
      let dx = t.clientX - cx, dy = t.clientY - cy;
      const m = Math.hypot(dx, dy);
      if (m > MAX) { dx *= MAX / m; dy *= MAX / m; }
      knob.style.left = (33 + dx) + 'px'; knob.style.top = (33 + dy) + 'px';
      touchMove.x = dx / MAX; touchMove.z = dy / MAX; touchMove.active = true;
    }
  }
  function end(e) {
    for (const t of e.changedTouches) {
      if (t.identifier !== joyId) continue;
      joyId = null; knob.style.left = '33px'; knob.style.top = '33px';
      touchMove.x = 0; touchMove.z = 0; touchMove.active = false;
    }
  }
  joy.addEventListener('touchstart', e => {
    e.preventDefault(); const t = e.changedTouches[0]; joyId = t.identifier;
    const r = joy.getBoundingClientRect(); cx = r.left + r.width / 2; cy = r.top + r.height / 2;
    Sound.resume(); move(e);
  }, { passive: false });
  joy.addEventListener('touchmove', e => { e.preventDefault(); move(e); }, { passive: false });
  joy.addEventListener('touchend', end); joy.addEventListener('touchcancel', end);

  document.getElementById('jump').addEventListener('touchstart', e => {
    e.preventDefault(); Sound.resume();
    if (state === 'play' && grounded) { vel.y = JUMP_V; grounded = false; Sound.jump(); }
    else if (state === 'win') startLevel(nextLevel());
  }, { passive: false });
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---------- Lights ----------
scene.add(new THREE.HemisphereLight(0x9fb4ff, 0x223355, 0.7));
const sun = new THREE.DirectionalLight(0xfff4e0, 1.15);
sun.position.set(16, 30, 12);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -50; sun.shadow.camera.right = 50;
sun.shadow.camera.top = 50; sun.shadow.camera.bottom = -50;
sun.shadow.camera.far = 100;
scene.add(sun);

// visible sun: crisp core + soft radial glow sprite, far off in the light's direction
{
  const dir = sun.position.clone().normalize();
  const sunPos = dir.multiplyScalar(650);
  // soft glow via a radial-gradient sprite (always camera-facing, additive)
  const cv = document.createElement('canvas'); cv.width = cv.height = 128;
  const g2 = cv.getContext('2d');
  const grd = g2.createRadialGradient(64, 64, 0, 64, 64, 64);
  grd.addColorStop(0.0, 'rgba(255,246,220,1)');
  grd.addColorStop(0.22, 'rgba(255,226,150,0.65)');
  grd.addColorStop(0.55, 'rgba(255,200,110,0.18)');
  grd.addColorStop(1.0, 'rgba(255,190,90,0)');
  g2.fillStyle = grd; g2.fillRect(0, 0, 128, 128);
  const glow = new THREE.Sprite(new THREE.SpriteMaterial({
    map: new THREE.CanvasTexture(cv), transparent: true,
    blending: THREE.AdditiveBlending, depthWrite: false, fog: false,
  }));
  glow.scale.set(260, 260, 1);
  glow.position.copy(sunPos);
  scene.add(glow);
  // bright crisp core
  const core = new THREE.Mesh(
    new THREE.SphereGeometry(22, 32, 32),
    new THREE.MeshBasicMaterial({ color: 0xfff6da, fog: false })
  );
  core.position.copy(sunPos);
  scene.add(core);
}

// ---------- Ball ----------
const BALL_R = 0.6;
const ball = new THREE.Mesh(
  new THREE.SphereGeometry(BALL_R, 32, 32),
  new THREE.MeshStandardMaterial({ color: 0x6cf0c2, roughness: 0.3, metalness: 0.25 })
);
ball.castShadow = true;
scene.add(ball);

// ---------- Levels ----------
// Platform: {x,z,w,d, y, sx?, sz?}
//   y  = surface height at platform CENTER
//   sx = slope dy/dx  (surface rises toward +x)
//   sz = slope dy/dz  (surface rises toward +z)
//   flat platform omits sx/sz. Ramps connect flush when edge heights match.
const PLAT_H = 0.8;
const LEVELS = [
  { // 1 - TUTORIAL: straight. just roll forward to the pad.
    start: { x: 0, z: 24 }, goalIdx: 2,
    platforms: [
      { x: 0, z: 24, w: 9, d: 10, y: 0 },   // start   z 19..29
      { x: 0, z: 3,  w: 8, d: 32, y: 0 },   // long straight   z -13..19
      { x: 0, z: -18,w: 9, d: 10, y: 0 },   // goal    z -23..-13
    ],
  },
  { // 2 - TUTORIAL: straight, then turn left and right (steering)
    start: { x: 0, z: 22 }, goalIdx: 5,
    platforms: [
      { x: 0,   z: 22, w: 7,  d: 8,  y: 0 },   // start
      { x: 0,   z: 10, w: 6,  d: 16, y: 0 },   // straight forward   z 2..18
      { x: -9,  z: 2,  w: 18, d: 6,  y: 0 },   // turn LEFT (-x)     x -18..0
      { x: -18, z: -8, w: 6,  d: 16, y: 0 },   // forward down       z -16..0
      { x: -9,  z: -14,w: 18, d: 6,  y: 0 },   // turn RIGHT (+x)    x -18..0
      { x: 0,   z: -20,w: 7,  d: 8,  y: 0 },   // goal
    ],
  },
  { // 3 - TUTORIAL: ramps. down, up, and down again.
    start: { x: 0, z: 26 }, goalIdx: 6,
    platforms: [
      { x: 0, z: 26, w: 8, d: 8,  y: 6 },                 // start high   z 22..30
      { x: 0, z: 14, w: 7, d: 16, y: 3, sz: 0.375 },      // down ramp (6 -> 0)   z 6..22
      { x: 0, z: 2,  w: 8, d: 8,  y: 0 },                 // valley       z -2..6
      { x: 0, z: -10,w: 7, d: 16, y: 3, sz: -0.375 },     // up ramp (0 -> 6)     z -18..-2
      { x: 0, z: -22,w: 8, d: 8,  y: 6 },                 // crest        z -26..-18
      { x: 0, z: -34,w: 7, d: 16, y: 3, sz: 0.375 },      // down ramp (6 -> 0)   z -42..-26
      { x: 0, z: -46,w: 8, d: 8,  y: 0 },                 // goal low     z -50..-42
    ],
  },
  { // 4 - TUTORIAL: hills. weave over varied mounds (keep your speed).
    start: { x: 0, z: 22 }, goalIdx: 2,
    platforms: [
      { x: 0, z: 22, w: 10, d: 8,  y: 0 },                // start   z 18..26
      { x: 0, z: -2, w: 10, d: 40, y: 0,                  // wide path, varied hills   z -22..18
        bumps: [
          { x: -3, z: 10, amp: 2.6, sig: 2.2 },           // tall, narrow (left)
          { x:  3, z: 3,  amp: 1.4, sig: 3.6 },           // low, broad (right)
          { x: -1, z: -6, amp: 3.4, sig: 2.0 },           // tallest peak
          { x:  3, z: -13,amp: 1.1, sig: 1.8 },           // small bump (right)
          { x: -3, z: -17,amp: 1.8, sig: 2.6 },           // medium (left)
        ] },
      { x: 0, z: -26,w: 10, d: 8,  y: 0 },                // goal   z -30..-22
    ],
  },
  { // 5 - TUTORIAL: a moving platform. hop on, ride, hop off.
    start: { x: 0, z: 22 }, goalIdx: 3,
    platforms: [
      { x: 0, z: 22, w: 7, d: 8, y: 2 },                                         // start
      { x: 0, z: 10, w: 6, d: 6, y: 2, move: { axis: 'x', amp: 7, period: 4 } }, // SLIDER (gap 5)
      { x: 0, z: -2, w: 7, d: 8, y: 2 },                                         // pad (gap 5)
      { x: 0, z: -16,w: 8, d: 8, y: 2 },                                         // goal (gap 6)
    ],
  },
  { // 6 - long rollercoaster: climb -> crest -> drop -> big lateral sweep -> climb to goal
    start: { x: -24, z: 26 }, goalIdx: 6,
    platforms: [
      { x: -24, z: 26, w: 8,  d: 8,  y: 2 },               // start
      { x: -24, z: 14, w: 6,  d: 18, y: 5, sz: -0.333 },   // up   (2 -> 8)
      { x: -24, z: 0,  w: 8,  d: 8,  y: 8 },               // crest
      { x: -24, z: -12,w: 6,  d: 18, y: 5, sz: 0.333 },    // down (8 -> 2)
      { x: -10, z: -24,w: 34, d: 6,  y: 2 },               // LONG lateral sweep +x
      { x: 7,   z: -14,w: 6,  d: 16, y: 5, sz: 0.375 },    // climb +z (2 -> 8)

const platMat  = new THREE.MeshStandardMaterial({ color: 0x36406e, roughness: 0.92 });
const rampMat   = new THREE.MeshStandardMaterial({ color: 0x455299, roughness: 0.9 });
// hill material: colors by height ABOVE THE PLATFORM BASE (attribute aH) so hills
// look the same at any elevation; plus simple sun shading
const hillMat = new THREE.ShaderMaterial({
  uniforms: { uSun: { value: new THREE.Vector3(16, 30, 12).normalize() } },
  side: THREE.DoubleSide,
  vertexShader: /* glsl */`
    attribute float aH;
    varying float vH;
    varying vec3 vNormalW;
    void main() {
      vH = aH;
      vNormalW = normalize(mat3(modelMatrix) * normal);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }`,
  fragmentShader: /* glsl */`
    varying float vH;
    varying vec3 vNormalW;
    uniform vec3 uSun;
    void main() {
      float t = clamp(vH / 3.0, 0.0, 1.0);
      vec3 col = mix(vec3(0.16, 0.40, 0.30), mix(vec3(0.35, 0.62, 0.34), vec3(0.72, 0.66, 0.40), t), t);
      float diff = clamp(dot(normalize(vNormalW), normalize(uSun)), 0.0, 1.0);
      gl_FragColor = vec4(col * (0.45 + 0.6 * diff), 1.0);
    }`,
});
const moverMat  = new THREE.MeshStandardMaterial({ color: 0xe08a3c, emissive: 0x572c0c, emissiveIntensity: 0.4, roughness: 0.7 });
const UP = new THREE.Vector3(0, 1, 0);

let platforms = [];      // physics: {minX,maxX,minZ,maxZ,y,cx,cz,sx,sz,bumps}
let platformMeshes = [];
let goalMesh = null;
const goalPos = new THREE.Vector3();

// full surface height at (x,z): base slope plane + local gaussian hills
function surfHeight(p, x, z) {
  let h = p.y + p.sx * (x - p.cx) + p.sz * (z - p.cz);
  if (p.bumps) for (const b of p.bumps) {
    const dx = x - b.x, dz = z - b.z;
    h += b.amp * Math.exp(-(dx * dx + dz * dz) / (2 * b.sig * b.sig));
  }
  return h;
}
// surface normal via finite-difference gradient (accounts for slope + bumps)
function surfNormal(p, x, z, out) {
  const e = 0.15;
  const hL = surfHeight(p, x - e, z), hR = surfHeight(p, x + e, z);
  const hD = surfHeight(p, x, z - e), hU = surfHeight(p, x, z + e);
  return out.set(-(hR - hL) / (2 * e), 1, -(hU - hD) / (2 * e)).normalize();
}

function clearLevel() {
  platformMeshes.forEach(m => scene.remove(m));
  platformMeshes = [];
  platforms = [];
  if (goalMesh) { scene.remove(goalMesh); goalMesh = null; }
}

function buildLevel(idx) {
  clearLevel();
  const lvl = LEVELS[idx];
  lvl.platforms.forEach((p, i) => {
    const sx = p.sx || 0, sz = p.sz || 0;
    const isRamp = sx !== 0 || sz !== 0;
    const geo = new THREE.BoxGeometry(p.w, PLAT_H, p.d);
    const mat = p.move ? moverMat : (isRamp ? rampMat : platMat);
    const mesh = new THREE.Mesh(geo, mat);
    // orient so top face normal = (-sx, 1, -sz)
    const normal = new THREE.Vector3(-sx, 1, -sz).normalize();
    mesh.quaternion.setFromUnitVectors(UP, normal);
    // center of the tilted slab: drop half-thickness along its own normal.
    // on bumped platforms, sink the slab extra so the green hill mesh (drawn at
    // the true surface height) never sits coplanar with the slab top (z-fighting)
    const sink = p.bumps ? 0.4 : 0;
    mesh.position.set(
      p.x - normal.x * PLAT_H / 2,
      p.y - normal.y * PLAT_H / 2 - sink,
      p.z - normal.z * PLAT_H / 2
    );
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    scene.add(mesh);
    platformMeshes.push(mesh);

    const phys = {
      minX: p.x - p.w / 2, maxX: p.x + p.w / 2,
      minZ: p.z - p.d / 2, maxZ: p.z + p.d / 2,
      cx: p.x, cz: p.z, y: p.y, sx, sz, bumps: p.bumps || null,
    };
    // moving / elevating platform: snapshot base + mesh origin, add per-frame velocity
    if (p.move) {
      phys.move = p.move;
      phys.base = { cx: phys.cx, cz: phys.cz, y: phys.y,
        minX: phys.minX, maxX: phys.maxX, minZ: phys.minZ, maxZ: phys.maxZ };
      phys.mesh = mesh;
      phys.mesh0 = mesh.position.clone();
      phys.vel = { x: 0, y: 0, z: 0 };
    }
    platforms.push(phys);

    // hills on the platform: displaced top surface matching the physics field
    if (p.bumps) {
      const segW = Math.max(2, Math.ceil(p.w * 3));
      const segD = Math.max(2, Math.ceil(p.d * 3));
      const hg = new THREE.PlaneGeometry(p.w, p.d, segW, segD);
      hg.rotateX(-Math.PI / 2);
      const pos = hg.attributes.position;
      const aH = new Float32Array(pos.count);
      for (let v = 0; v < pos.count; v++) {
        const wx = p.x + pos.getX(v), wz = p.z + pos.getZ(v);
        const sh = surfHeight(phys, wx, wz);
        pos.setY(v, sh);
        aH[v] = sh - p.y;                // height above the platform base
      }
      pos.needsUpdate = true;
      hg.setAttribute('aH', new THREE.BufferAttribute(aH, 1));
      hg.computeVertexNormals();
      const hillMesh = new THREE.Mesh(hg, hillMat);
      hillMesh.position.set(p.x, 0, p.z);
      hillMesh.castShadow = true;
      hillMesh.receiveShadow = true;
      scene.add(hillMesh);
      platformMeshes.push(hillMesh);
    }

    if (i === lvl.goalIdx) {
      goalPos.set(p.x, p.y, p.z);
      goalMesh = new THREE.Mesh(
        new THREE.CylinderGeometry(1.5, 1.5, 0.35, 32),
        new THREE.MeshStandardMaterial({ color: 0x35d07f, emissive: 0x1c7a48, emissiveIntensity: 0.7, roughness: 0.4 })
      );
      goalMesh.position.set(p.x, p.y + 0.18, p.z);
      goalMesh.receiveShadow = true;
      const ring = new THREE.Mesh(
        new THREE.TorusGeometry(1.8, 0.11, 12, 40),
        new THREE.MeshStandardMaterial({ color: 0x6cf0c2, emissive: 0x35d07f, emissiveIntensity: 1 })
      );
      ring.rotation.x = Math.PI / 2; ring.position.y = 1.3;
      goalMesh.add(ring);
      scene.add(goalMesh);
    }
  });

  const s = lvl.platforms[0];
  ballPos.set(lvl.start.x, s.y + BALL_R, lvl.start.z);
  vel.set(0, 0, 0);
  ball.position.copy(ballPos);
}

// pick supporting platform: contains (x,z), highest plane <= ball top
function support(x, z, ballY) {
  let best = null, bestY = -Infinity;
  for (const p of platforms) {
    if (x < p.minX || x > p.maxX || z < p.minZ || z > p.maxZ) continue;
    const ph = surfHeight(p, x, z);
    if (ph <= ballY - BALL_R + 0.5 && ph > bestY) { bestY = ph; best = p; }
  }
  return best;
}

// ---------- Physics ----------
const ballPos = new THREE.Vector3();
const vel = new THREE.Vector3();
const GRAVITY = 38;
const TERMINAL_V = -65;    // max fall speed -> sustained plunge, not a teleport
const FLOAT_Y = -400;      // depth where a fall eases into a drifting hover
const GROUND_ACCEL = 42;   // steering thrust on ground (was 30)
const AIR_ACCEL = 28;      // mid-air steering
const GROUND_GRIP = 7;     // how fast velocity re-aligns to input on ground (snappy turns)
const AIR_GRIP = 3.5;      // gentler in the air
const MAX_SPEED = 22;
const GROUND_FRICTION = 1.6;
const JUMP_V = 15;
const normal = new THREE.Vector3();

// steer: accelerate toward (dx,dz) and bleed the velocity component
// perpendicular to the input so the ball turns crisply instead of drifting wide
function steer(dx, dz, accel, grip, dt) {
  vel.x += dx * accel * dt;
  vel.z += dz * accel * dt;
  const dot = vel.x * dx + vel.z * dz;          // speed along input dir
  const px = vel.x - dot * dx, pz = vel.z - dot * dz; // sideways part
  const k = Math.max(0, 1 - grip * dt);
  vel.x = dot * dx + px * k;
  vel.z = dot * dz + pz * k;
}

let level = 0, elapsed = 0;
let state = 'menu'; // menu | play | win | fall
let grounded = false, wasGrounded = false, sndGrounded = false;
let hoverT = 0; // free-running clock for the edge-of-galaxy drift
const carry = new THREE.Vector3(); // velocity of the platform currently underfoot

// ---------- Input ----------
const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  Sound.resume();
  if (e.code === 'Space') {
    if (state === 'menu') startLevel(level);
    else if (state === 'win') startLevel(nextLevel());
    else if (state === 'play' && grounded) { vel.y = JUMP_V; grounded = false; Sound.jump(); }
  }
  if (e.code === 'KeyM') Sound.toggleMute();
  if (e.code === 'KeyL') { lbPanel.classList.contains('on') ? closeLeaderboard() : openLeaderboard(level); }
  if (e.code === 'Escape') closeLeaderboard();
  if (e.code === 'KeyR') startLevel(level);
  if (e.code === 'BracketRight') startLevel(Math.min(LEVELS.length - 1, level + 1)); // next level
  if (e.code === 'BracketLeft') startLevel(Math.max(0, level - 1));                  // prev level
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
});
addEventListener('keyup', e => { keys[e.code] = false; });
function nextLevel() { level = (level + 1) % LEVELS.length; return level; }

// ---------- Flow ----------
const banner = document.getElementById('banner');
const bannerTitle = document.getElementById('banner-title');
const bannerSub = document.getElementById('banner-sub');
const elTime = document.getElementById('time');
function showBanner(t, s) { bannerTitle.textContent = t; bannerSub.innerHTML = s; banner.style.display = 'flex'; }
function hideBanner() { banner.style.display = 'none'; }

// ---------- Scoreboard (best time per level, persisted) ----------
const BEST_KEY = 'ballRoller.best.v1';
let best = loadBest();
function loadBest() {
  try { return JSON.parse(localStorage.getItem(BEST_KEY)) || {}; } catch (e) { return {}; }
}
function saveBest() {
  try { localStorage.setItem(BEST_KEY, JSON.stringify(best)); } catch (e) {}
}
const elScores = document.getElementById('scores-body');
function renderScores() {
  let html = '', total = 0, complete = true;
  for (let i = 0; i < LEVELS.length; i++) {
    const b = best[i];
    if (b == null) complete = false; else total += b;
    const cls = 'srow' + (i === level ? ' cur' : '') + (b == null ? ' empty' : '');
    html += `<div class="${cls}"><span>Lvl ${i + 1}</span><span>${b == null ? '—' : b.toFixed(1) + 's'}</span></div>`;
  }
  html += `<div class="srow total"><span>Total</span><span>${complete ? total.toFixed(1) + 's' : '—'}</span></div>`;
  elScores.innerHTML = html;
}
// record a finished level; returns {improved, prev}
function recordTime(idx, t) {
  const prev = best[idx];
  const improved = prev == null || t < prev;
  if (improved) { best[idx] = +t.toFixed(1); saveBest(); }
  renderScores();
  buildLevelPicker();
  return { improved, prev };
}

// ---------- Level picker (dropdown in the HUD) ----------
const levelPick = document.getElementById('levelpick');
function buildLevelPicker() {
  levelPick.innerHTML = '';
  for (let i = 0; i < LEVELS.length; i++) {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = `${i + 1}${best[i] != null ? ' · ' + best[i].toFixed(1) + 's' : ''}`;
    levelPick.appendChild(opt);
  }
  levelPick.value = level;
}
levelPick.addEventListener('change', () => { startLevel(+levelPick.value); levelPick.blur(); });

function startLevel(idx) {
  level = idx;
  buildLevel(level);
  elapsed = 0;
  hoverT = 0;
  state = 'play';
  hideBanner();
  levelPick.value = level;
  renderScores();
}

// ---------- Camera (orbit: drag to rotate, wheel to zoom) ----------
const camTarget = new THREE.Vector3();
const camDesired = new THREE.Vector3();
let camYaw = 0, camPitch = 0.62, camDist = 22;
{
  const dom = renderer.domElement;
  let dragging = false, lastX = 0, lastY = 0;
  dom.addEventListener('mousedown', e => { dragging = true; lastX = e.clientX; lastY = e.clientY; });
  addEventListener('mouseup', () => { dragging = false; });
  addEventListener('mousemove', e => {
    if (!dragging) return;
    camYaw -= (e.clientX - lastX) * 0.005;
    camPitch = Math.min(1.45, Math.max(-1.35, camPitch + (e.clientY - lastY) * 0.004));
    lastX = e.clientX; lastY = e.clientY;
  });
  dom.addEventListener('wheel', e => {
    e.preventDefault();
    camDist = Math.min(60, Math.max(8, camDist + e.deltaY * 0.02));
  }, { passive: false });
}

// ---------- Update ----------
function updatePlatforms(t) {
  for (const p of platforms) {
    const m = p.move; if (!m) continue;
    const w = 2 * Math.PI / m.period, ph = m.phase || 0;
    const off = m.amp * Math.sin(t * w + ph);
    const vv = m.amp * w * Math.cos(t * w + ph);
    const ox = m.axis === 'x' ? off : 0;
    const oy = m.axis === 'y' ? off : 0;
    const oz = m.axis === 'z' ? off : 0;
    p.cx = p.base.cx + ox; p.cz = p.base.cz + oz; p.y = p.base.y + oy;
    p.minX = p.base.minX + ox; p.maxX = p.base.maxX + ox;
    p.minZ = p.base.minZ + oz; p.maxZ = p.base.maxZ + oz;
    p.vel.x = m.axis === 'x' ? vv : 0;
    p.vel.y = m.axis === 'y' ? vv : 0;
    p.vel.z = m.axis === 'z' ? vv : 0;
    p.mesh.position.set(p.mesh0.x + ox, p.mesh0.y + oy, p.mesh0.z + oz);
  }
}

function update(dt) {
  if (state !== 'play' && state !== 'falling') return;
  if (state === 'play') {
    elapsed += dt;
    elTime.textContent = elapsed.toFixed(1);
    updatePlatforms(elapsed);
  }

  let ix = 0, iz = 0;
  if (keys['ArrowUp'] || keys['KeyW']) iz -= 1;
  if (keys['ArrowDown'] || keys['KeyS']) iz += 1;
  if (keys['ArrowLeft'] || keys['KeyA']) ix -= 1;
  if (keys['ArrowRight'] || keys['KeyD']) ix += 1;
  if (touchMove.active) { ix += touchMove.x; iz += touchMove.z; } // virtual joystick
  const il = Math.hypot(ix, iz);
  if (il > 0) {
    ix /= il; iz /= il;
    // rotate input into camera space so W is always "away from camera"
    const c = Math.cos(camYaw), s = Math.sin(camYaw);
    const rx = ix * c + iz * s, rz = -ix * s + iz * c;
    ix = rx; iz = rz;
  }

  const p = support(ballPos.x, ballPos.z, ballPos.y);
  grounded = p && vel.y <= 0.01 && ballPos.y <= surfHeight(p, ballPos.x, ballPos.z) + BALL_R + 0.12;

  if (grounded) {
    surfNormal(p, ballPos.x, ballPos.z, normal);
    // gravity projected onto slope tangent -> roll down the incline / over hills
    const gDotN = -GRAVITY * normal.y;
    vel.x += (-gDotN * normal.x) * dt;
    vel.z += (-gDotN * normal.z) * dt;
    // steering (crisp turns via grip)
    if (il > 0) steer(ix, iz, GROUND_ACCEL, GROUND_GRIP, dt);
    // friction
    const damp = Math.max(0, 1 - GROUND_FRICTION * dt);
    vel.x *= damp; vel.z *= damp;
    const hs = Math.hypot(vel.x, vel.z);
    if (hs > MAX_SPEED) { vel.x *= MAX_SPEED / hs; vel.z *= MAX_SPEED / hs; }
    // snap to surface
    ballPos.y = surfHeight(p, ballPos.x, ballPos.z) + BALL_R;
    if (vel.y < 0) vel.y = 0;
    // ride moving platforms (position carry keeps the ball stuck; vertical via snap above)
    if (p.vel) { ballPos.x += p.vel.x * dt; ballPos.z += p.vel.z * dt; carry.set(p.vel.x, p.vel.y, p.vel.z); }
    else carry.set(0, 0, 0);
  } else if (state === 'falling' && ballPos.y < FLOAT_Y) {
    // reached the edge of the galaxy: ease into a slow drifting hover
    hoverT += dt;
    vel.y += (FLOAT_Y - ballPos.y) * 2.0 * dt; // spring toward the hover line
    vel.y *= 0.90;                             // damp vertical
    vel.x = vel.x * 0.985 + Math.sin(hoverT * 0.6) * 1.2 * dt;  // gentle wander
    vel.z = vel.z * 0.985 + Math.cos(hoverT * 0.45) * 1.2 * dt;
    // zero-G thruster: WASD nudges the drift
    if (il > 0) {
      vel.x += ix * 16 * dt; vel.z += iz * 16 * dt;
      const hs = Math.hypot(vel.x, vel.z);
      if (hs > 14) { vel.x *= 14 / hs; vel.z *= 14 / hs; }
    }
  } else {
    vel.y -= GRAVITY * dt;
    if (vel.y < TERMINAL_V) vel.y = TERMINAL_V;
    // mid-air steering (weaker than ground)
    if (il > 0) {
      steer(ix, iz, AIR_ACCEL, AIR_GRIP, dt);
      const hs = Math.hypot(vel.x, vel.z);
      if (hs > MAX_SPEED) { vel.x *= MAX_SPEED / hs; vel.z *= MAX_SPEED / hs; }
    }
  }

  // leaving the ground (jump or roll-off): inherit the platform's momentum
  if (wasGrounded && !grounded) { vel.x += carry.x; vel.y += carry.y; vel.z += carry.z; }
  wasGrounded = grounded;

  const prevBottom = ballPos.y - BALL_R;
  const prevX0 = ballPos.x, prevZ0 = ballPos.z;
  ballPos.x += vel.x * dt;
  ballPos.y += vel.y * dt;
  ballPos.z += vel.z * dt;

  if (!grounded) {
    // 1) landing: the ball's bottom dropped onto a platform top this frame
    //    (fast fall or arriving above the edge with enough arc) -> land on top
    if (vel.y <= 0.01) {
      let bestSurf = -Infinity, hitPf = null;
      for (const pf of platforms) {
        if (ballPos.x < pf.minX || ballPos.x > pf.maxX || ballPos.z < pf.minZ || ballPos.z > pf.maxZ) continue;
        const surf = surfHeight(pf, ballPos.x, ballPos.z);
        if (prevBottom >= surf - 0.05 && ballPos.y - BALL_R < surf && surf > bestSurf) { bestSurf = surf; hitPf = pf; }
      }
      if (hitPf) {
        ballPos.y = bestSurf + BALL_R;
        vel.y = 0; grounded = true; wasGrounded = true;
        if (hitPf.vel) carry.set(hitPf.vel.x, hitPf.vel.y, hitPf.vel.z); else carry.set(0, 0, 0);
      }
    }
    // 2) side wall: ball entered a platform's footprint from the side while below
    //    its top (didn't clear the edge) -> block like a wall, ball drops down it
    if (!grounded) {
      for (const pf of platforms) {
        if (ballPos.x < pf.minX || ballPos.x > pf.maxX || ballPos.z < pf.minZ || ballPos.z > pf.maxZ) continue;
        const surf = surfHeight(pf, ballPos.x, ballPos.z);
        if (ballPos.y - BALL_R >= surf - 0.02) continue;          // above the top: no wall
        const wasOutX = prevX0 < pf.minX || prevX0 > pf.maxX;
        const wasOutZ = prevZ0 < pf.minZ || prevZ0 > pf.maxZ;
        if (wasOutX) { ballPos.x = (prevX0 < pf.minX) ? pf.minX - 0.01 : pf.maxX + 0.01; if ((prevX0 < pf.minX) === (vel.x > 0)) vel.x = 0; }
        if (wasOutZ) { ballPos.z = (prevZ0 < pf.minZ) ? pf.minZ - 0.01 : pf.maxZ + 0.01; if ((prevZ0 < pf.minZ) === (vel.z > 0)) vel.z = 0; }
      }
    }
  }

  // sound: land thud on touchdown, rolling rumble scaled by ground speed
  if (grounded && !sndGrounded) Sound.land();
  sndGrounded = grounded;
  Sound.roll(Math.hypot(vel.x, vel.z), grounded);

  ball.rotation.z -= vel.x * dt / BALL_R;
  ball.rotation.x += vel.z * dt / BALL_R;
  if (!grounded) { ball.rotation.x += 2.0 * dt; ball.rotation.y += 1.0 * dt; } // tumble in the air
  ball.position.copy(ballPos);

  // begin the plunge once clearly off the course -> fall with the ball
  if (state === 'play' && !grounded && ballPos.y < -7) { state = 'falling'; Sound.fall(); }
  if (state !== 'play') return; // no goal check while falling / drifting
  const dx = ballPos.x - goalPos.x, dz = ballPos.z - goalPos.z;
  if (dx * dx + dz * dz < 1.8 * 1.8 && ballPos.y <= goalPos.y + BALL_R + 0.6) {
    state = 'win';
    Sound.win();
    const last = level === LEVELS.length - 1;
    const { improved, prev } = recordTime(level, elapsed);
    if (improved) submitScore(level, Math.round(elapsed * 1000));  // send to global leaderboard
    const bestLine = improved
      ? `<span class="best">★ NEW BEST ${elapsed.toFixed(1)}s</span>`
      : `Time ${elapsed.toFixed(1)}s &nbsp; Best <span class="best">${prev.toFixed(1)}s</span>`;
    showBanner(last ? 'All levels clear! 🏁' : 'Level clear!',
      `${bestLine}<br><span class="key">SPACE</span> next &nbsp; <span class="key">R</span> retry &nbsp; <span class="key">L</span> leaderboard`);
  }
}

function render() {
  camTarget.lerp(ballPos, 0.12);
  const cp = Math.cos(camPitch), sp = Math.sin(camPitch);
  camDesired.set(
    camTarget.x + camDist * cp * Math.sin(camYaw),
    camTarget.y + camDist * sp,
    camTarget.z + camDist * cp * Math.cos(camYaw)
  );
  camera.position.lerp(camDesired, 0.12);
  camera.lookAt(camTarget.x, camTarget.y, camTarget.z);
  if (goalMesh) goalMesh.rotation.y += 0.015;
  stars.rotation.y += 0.00006;
  starMat.uniforms.uTime.value += 0.016;
  renderer.render(scene, camera);
}

// ---------- Boot ----------
const clock = new THREE.Clock();
renderScores();
buildLevelPicker();
startLevel(0); // straight into play, no start menu

function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  update(dt);
  render();
  requestAnimationFrame(tick);
}
tick();
</script>
</body>
</html>
